function segd(x,y,x0,y0,x1,y1){var dx=x1-x0,dy=y1-y0,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((x-x0)*dx+(y-y0)*dy)/l)):0;return Math.hypot(x-x0-t*dx,y-y0-t*dy)}
function ridge(x,y,x0,y0,x1,y1,w,h){var d=segd(x,y,x0,y0,x1,y1);return h*Math.exp(-(d*d)/(w*w))}
